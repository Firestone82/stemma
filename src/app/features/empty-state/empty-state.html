<svg class="mark" viewBox="0 0 26 30" aria-hidden="true">
  <path d="M0,0H26V12.6C26,22.2 19.5,27.6 13,30C6.5,27.6 0,22.2 0,12.6Z" />
</svg>
<h1 id="empty-title">{{ t('empty.title') }}</h1>
<p>{{ t('empty.text') }}</p>
<div class="actions">
  @if (canResume()) {
    <button type="button" class="btn primary" (click)="ui.home.set(false)">{{ t('empty.resume') }}</button>
    <button type="button" class="btn" (click)="documents.newTree()"><stemma-icon name="plus" [size]="16" />{{ t('file.new') }}</button>
  } @else {
    <button type="button" class="btn primary" (click)="addFirst()"><stemma-icon name="plus" [size]="16" />{{ t('empty.addFirst') }}</button>
  }
  <button type="button" class="btn" (click)="documents.openFile()"><stemma-icon name="folder" [size]="16" />{{ t('empty.open') }}</button>
  @if (documents.offersDrive()) {
    <button type="button" class="btn" (pointerenter)="documents.prepareDrive()" (focus)="documents.prepareDrive()" (click)="documents.openFromDrive()">
      <stemma-icon name="cloud" [size]="16" />{{ t('empty.openDrive') }}
    </button>
  }
</div>
<button type="button" class="link-btn" (click)="documents.loadSample()">{{ t('empty.sample') }}</button>
@if (recent().length) {
  <section class="recent" aria-labelledby="recent-title">
    <h2 id="recent-title">{{ t('recent.title') }}</h2>
    <ul>
      @for (entry of recent(); track entry.key) {
        <li>
          <button type="button" class="open" (pointerenter)="entry.kind === 'drive' && documents.prepareDrive()" (click)="documents.openRecent(entry)">
            <stemma-icon [name]="entry.kind === 'drive' ? 'cloud' : 'folder'" [size]="16" />
            <span class="names">
              <span class="first">
                <span class="title"
                  >{{ entry.title || entry.name }}
                  @if (entry.title) {
                    <span class="file"> · {{ entry.name }}</span>
                  }
                </span>
                <span class="when">{{ when(entry.saved ?? entry.at) }}</span>
              </span>
              <span class="meta">{{ where(entry) }}</span>
            </span>
          </button>
          <button
            type="button"
            class="btn ghost small icon forget"
            [attr.aria-label]="t('recent.forget', { name: entry.name })"
            [attr.title]="t('recent.forget', { name: entry.name })"
            (click)="documents.forgetRecent(entry)"
          >
            <stemma-icon name="close" [size]="14" />
          </button>
        </li>
      }
    </ul>
    <p class="hint">{{ t('recent.hint') }}</p>
  </section>
}
