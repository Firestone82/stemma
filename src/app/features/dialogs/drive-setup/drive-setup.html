<div class="dialog-body">
  <h2>{{ t('dialog.drive.title') }}</h2>
  <p>{{ t('dialog.drive.text') }}</p>
  <ol class="steps">
    @for (step of steps; track step) {
      <li>{{ t(step, { origin }) }}</li>
    }
  </ol>
  <p class="note">{{ t('dialog.drive.note') }}</p>
</div>
<div class="dialog-actions">
  <button type="button" class="btn primary" (click)="done.emit()">{{ t('common.done') }}</button>
</div>
