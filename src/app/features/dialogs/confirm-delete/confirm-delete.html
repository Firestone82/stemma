<div class="dialog-body">
  <h2>{{ ids().size === 1 ? t('dialog.delete.title', { name: name() }) : t('dialog.delete.manyTitle', { count: ids().size }) }}</h2>
  <p>{{ ids().size === 1 ? t('dialog.delete.text', { name: name() }) : t('dialog.delete.manyText') }}</p>
</div>
<div class="dialog-actions">
  <button type="button" class="btn" (click)="done.emit()">{{ t('common.cancel') }}</button>
  <button #confirmButton type="button" class="btn primary" (click)="confirm()"><stemma-icon name="trash" [size]="16" />{{ t('dialog.delete.confirm') }}</button>
</div>
