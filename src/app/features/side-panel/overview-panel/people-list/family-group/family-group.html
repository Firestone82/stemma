<div class="row">
  <button type="button" class="head" [attr.aria-expanded]="open()" (click)="toggleOpen.emit()">
    <span class="name">
      <stemma-icon name="chevronRight" class="chevron" [size]="14" />
      <span class="mini-shield" [attr.data-tincture]="tincture()"></span>
      <span class="label">{{ label() }}</span>
    </span>
    <span class="count" [attr.aria-label]="countLabel()">{{ members().length }}</span>
  </button>
  @if (viewLabel()) {
    <button type="button" class="view" [attr.aria-label]="viewLabel()" [title]="viewLabel()" (click)="view.emit()">
      <stemma-icon name="tree" [size]="16" />
    </button>
  }
</div>
@if (open()) {
  <ul class="members">
    @for (m of members(); track m.id) {
      <li>
        <button
          type="button"
          stemmaPersonRow
          [class.off-chart]="m.offChart"
          [name]="m.name"
          [dates]="m.dates"
          [tincture]="m.tincture"
          [missing]="m.missing ?? ''"
          [problem]="m.problem ?? ''"
          [attr.title]="m.offChart ? offChartHint() : null"
          (click)="pick.emit(m.id)"
        ></button>
      </li>
    }
  </ul>
}
