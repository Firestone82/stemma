<button type="button" class="btn ghost icon" (click)="undo()" [disabled]="!canUndo()" [attr.aria-label]="t('history.undo')" [title]="t('history.undoHint')">
  <stemma-icon name="undo" />
</button>
<button type="button" class="btn ghost icon" (click)="redo()" [disabled]="!canRedo()" [attr.aria-label]="t('history.redo')" [title]="t('history.redoHint')">
  <stemma-icon name="redo" />
</button>
