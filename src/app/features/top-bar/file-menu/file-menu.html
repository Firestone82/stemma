<button type="button" class="btn" (click)="ui.toggleMenu('file')" aria-haspopup="menu" [attr.aria-expanded]="open()">
  {{ t('file.menu') }} <stemma-icon name="chevronDown" [size]="14" />
</button>
@if (open()) {
  <div class="menu" role="menu" [attr.aria-label]="t('file.menu')">
    <button type="button" class="menu-item" role="menuitem" (click)="documents.newTree()">
      <stemma-icon name="file" />{{ t('file.new') }}<span class="shortcut">Ctrl N</span>
    </button>
    @if (documents.fileBacked()) {
      <button type="button" class="menu-item" role="menuitem" (click)="documents.closeTree()"><stemma-icon name="close" />{{ t('file.close') }}</button>
    }
    <button type="button" class="menu-item" role="menuitem" (click)="documents.openFile()">
      <stemma-icon name="folder" />{{ t('file.open') }}<span class="shortcut">Ctrl O</span>
    </button>
    <button type="button" class="menu-item" role="menuitem" [attr.title]="sourceName()" (click)="documents.saveXml()">
      <stemma-icon name="download" />{{ saveLabel() }}<span class="shortcut">Ctrl S</span>
    </button>
    @if (documents.source()) {
      <button type="button" class="menu-item" role="menuitem" (click)="documents.saveXmlAs()">
        <stemma-icon name="copy" />{{ t('file.saveAs') }}<span class="shortcut">Ctrl Shift S</span>
      </button>
    }
    <div class="menu-sep" role="separator"></div>
    <button type="button" class="menu-item" role="menuitem" (click)="documents.exportGedcom()"><stemma-icon name="upload" />{{ t('file.gedcom') }}</button>
    <button type="button" class="menu-item" role="menuitem" (click)="documents.exportFamilyDocument()">
      <stemma-icon name="tree" />{{ t('file.familyDocument') }}
    </button>
    <div class="menu-sep" role="separator"></div>
    <button type="button" class="menu-item" role="menuitem" (click)="parts.exportPart()"><stemma-icon name="people" />{{ t('file.exportPart') }}</button>
    <button type="button" class="menu-item" role="menuitem" (click)="parts.importPart()"><stemma-icon name="link" />{{ t('file.mergePart') }}</button>
    <div class="menu-sep" role="separator"></div>
    <button type="button" class="menu-item" role="menuitem" (click)="documents.openPrint()">
      <stemma-icon name="printer" />{{ t('file.print') }}<span class="shortcut">Ctrl P</span>
    </button>
    <div class="menu-sep" role="separator"></div>
    <button type="button" class="menu-item" role="menuitem" (click)="documents.loadSample()"><stemma-icon name="people" />{{ t('file.sample') }}</button>
    <button type="button" class="menu-item" role="menuitem" (click)="documents.showAbout()"><stemma-icon name="info" />{{ t('file.about') }}</button>
  </div>
}
