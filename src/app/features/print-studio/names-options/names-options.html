@let s = model.view();
<h3 id="print-g-names">{{ t('print.namesGroup') }}</h3>
<div class="studio-pair">
  <stemma-letter-size key="legendSize" />
  @if (onPaper() && underTitle()) {
    <div class="field">
      <label for="print-names-gap">{{ t('print.namesGap') }}</label>
      <div class="unit">
        <input
          id="print-names-gap"
          class="input"
          inputmode="decimal"
          autocomplete="off"
          [class.auto]="s.legendGap === undefined"
          [value]="gapText()"
          (change)="setGap($event)"
        />
        <span class="suffix">cm</span>
      </div>
    </div>
  }
</div>
@if (onPaper()) {
  <div class="studio-pair">
    <div class="field">
      <span class="field-label" id="print-names-place">{{ t('print.place') }}</span>
      <div class="place">
        <stemma-anchor-picker labelledBy="print-names-place" [value]="s.legendAnchor ?? null" (valueChange)="hold($event)" />
        <button type="button" class="btn small" [class.chosen]="placed() === 'page'" [attr.aria-pressed]="placed() === 'page'" (click)="leaveToPage()">
          {{ t('print.placeAuto') }}
        </button>
      </div>
    </div>
    <div class="field">
      <span class="field-label" id="print-names-float">{{ t('print.namesFloat') }}</span>
      <div class="place">
        <stemma-anchor-picker labelledBy="print-names-float" [disabled]="!sized()" [value]="s.legendAlign ?? 'center'" (valueChange)="float($event)" />
        @if (sized() && placed() === 'held') {
          <button type="button" class="btn small" (click)="fitBox()">{{ t('print.namesFitBox') }}</button>
        }
      </div>
    </div>
  </div>
}
