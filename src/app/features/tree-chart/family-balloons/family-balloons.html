@for (s of slots(); track s.id) {
  <svg:g
    class="slot"
    role="button"
    tabindex="0"
    [attr.data-kind]="s.kind"
    [attr.aria-label]="labels().get(s.id)"
    [attr.transform]="'translate(' + s.x + ',' + s.y + ')'"
    (click)="onPick(s.id, $event)"
    (keydown.enter)="onPick(s.id, $event)"
    (keydown.space)="onPick(s.id, $event)"
    (pointerdown)="$event.stopPropagation()"
  >
    <svg:rect class="body" [attr.width]="s.w" [attr.height]="s.h" rx="5" />
    @for (t of s.shields; track $index) {
      <svg:path
        class="shield"
        [attr.data-tincture]="t"
        [attr.d]="shield"
        [attr.transform]="'translate(' + (startOf(s) + $index * pitch) + ',' + (s.h / 2 - 16) + ')'"
      />
    }
    <svg:text class="name" [attr.x]="startOf(s) + s.shields.length * pitch" [attr.y]="s.h / 2 - 10" dominant-baseline="central">{{ s.text }}</svg:text>
    <svg:text class="more" [attr.x]="s.w / 2" [attr.y]="s.h / 2 + 12" text-anchor="middle" dominant-baseline="central">{{ hint()(s.shields.length) }}</svg:text>
    <svg:title>{{ labels().get(s.id) }}</svg:title>
  </svg:g>
}
