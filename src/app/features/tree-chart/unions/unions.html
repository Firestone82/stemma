@for (u of unions(); track u.familyId) {
  @if (u.d) {
    <svg:path class="partner-line" [attr.d]="u.d" />
    @if (cuts().get(u.familyId); as title) {
      <svg:g class="cuttable" (click)="onCut(u.familyId, $event)">
        <svg:path class="cut-show" [attr.d]="u.d" />
        <svg:path class="cut-hit" [attr.d]="u.d" />
        <svg:title>{{ title }}</svg:title>
      </svg:g>
    }
  }
  @if (u.at; as at) {
    @let m = u.mark;
    <svg:g class="union" [attr.data-kind]="m.kind" [class.apart]="m.apart" (click)="onPick(u.familyId, $event)">
      <svg:circle class="hit" [attr.cx]="at.x" [attr.cy]="at.y" r="14" />
      <svg:rect class="badge" [attr.x]="m.plate.x" [attr.y]="m.plate.y" [attr.width]="m.plate.w" [attr.height]="m.plate.h" [attr.rx]="m.plate.rx" />
      @for (ring of m.rings; track $index) {
        <svg:circle class="ring" [attr.cx]="ring.cx" [attr.cy]="ring.cy" [attr.r]="ring.r" />
      }
      @if (m.stone) {
        <svg:path class="stone" [attr.d]="m.stone" />
      }
      @if (m.dot) {
        <svg:circle class="dot" [attr.cx]="at.x" [attr.cy]="at.y" [attr.r]="m.dot" />
      }
      @if (m.slash) {
        <svg:path class="cut-under" [attr.d]="m.slash" />
        <svg:path class="cut" [attr.d]="m.slash" />
      }
      <svg:title>{{ u.title }}</svg:title>
    </svg:g>
  }
}
